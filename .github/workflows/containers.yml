name: containers

# Builds each image in containers/ for linux/amd64 and linux/arm64. The
# starter image runs its own claim, that Node and Claude Code start; the
# verification image runs the gates selftest and the checks below. A
# container exists to run the same on any host, so an image that builds on
# one architecture only is a failure here, not a README note.
#
# Each architecture builds on a native runner, never under emulation: an
# emulated pass is not a native one, and CodeQL under emulation runs many
# times slower. Docker builds here because both runner images ship it; the
# Containerfile in each directory is the one podman builds locally.
#
# The verification image also runs compliance, the schema and SBOM checks and a CodeQL scan. The scan
# exits 1 when it finds any alert, and main carries dismissed alerts, so the
# step passes on 0 or 1 with both per-language counts printed, and fails on
# 2, an analysis that did not finish. Comparing alerts is CodeQL's own job
# in CI, not this one's.
#
# The two build jobs, build (ubuntu-latest) and build (ubuntu-24.04-arm),
# are required checks, so the job always runs and reports. On a pull request
# whose every changed file is Markdown outside skills/, the build steps are
# skipped and the job passes: no check below reads such a file, except
# through gates.sh, which gates.yml runs on the same pull request. A change
# to skills/ is read by skills-spec.sh, so it builds. A push to main always
# builds, so main carries a full run on both architectures.
#
# Run the same thing yourself, one architecture:
#   containers/verify/verify . ./scripts/gates.sh --selftest
#   containers/starter/run "$(mktemp -d)" sh -c 'node --version && claude --version'

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    timeout-minutes: 45
    strategy:
      # Let both architectures finish. A failure on one is information about
      # the other only if the other has run to the end.
      fail-fast: false
      matrix:
        runner: [ubuntu-latest, ubuntu-24.04-arm]
    runs-on: ${{ matrix.runner }}
    steps:
      # Pinned by commit SHA, as in gates.yml. See
      # docs/security-posture.md, row 3.7.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The merge commit and its parents, so the next step can diff a
          # pull request against its base.
          fetch-depth: 2

      # Any doubt builds: a push, a diff that fails, or one file that is not
      # Markdown outside skills/.
      - name: Decide whether the images need building
        id: changed
        run: |
          build=true
          if [ "$GITHUB_EVENT_NAME" = pull_request ] &&
             files=$(git diff --name-only HEAD^1 HEAD); then
            printf '%s\n' "$files"
            build=false
            # Here-strings, not pipes: the step's shell sets pipefail, and
            # grep -q closing a pipe early would read as no match.
            grep -qv -e '\.md$' -e '^$' <<<"$files" && build=true
            grep -q '^skills/' <<<"$files" && build=true
          fi
          echo "build=$build"
          echo "build=$build" >> "$GITHUB_OUTPUT"

      - name: Build the starter image
        if: steps.changed.outputs.build == 'true'
        run: docker build -t kit-starter -f containers/starter/Containerfile containers/starter

      # As containers/starter/run does: the calling user's uid, no network.
      # The gates selftest runs once, in the verification image below.
      - name: Node and Claude Code start in the starter image
        if: steps.changed.outputs.build == 'true'
        run: |
          docker run --rm --network=none --user "$(id -u):$(id -g)" -v "$PWD:/kit:ro" kit-starter \
            sh -c 'uname -m && node --version && claude --version'

      - name: Build the verification image
        if: steps.changed.outputs.build == 'true'
        run: docker build -t kit-verify -f containers/verify/Containerfile containers/verify

      - name: Gates, compliance, schema and skills selftests in the verification image
        if: steps.changed.outputs.build == 'true'
        run: |
          docker run --rm --network=none -v "$PWD:/src:ro" kit-verify \
            sh -c 'uname -m && codeql version --format=terse \
              && cp -a /src /tmp/work && cd /tmp/work \
              && ./scripts/gates.sh --selftest && ./scripts/compliance.sh --require --selftest \
              && ./scripts/schemas.sh --selftest \
              && ./scripts/skills-spec.sh --selftest'

      - name: Coverage floors in the verification image
        if: steps.changed.outputs.build == 'true'
        run: |
          docker run --rm --network=none -v "$PWD:/src:ro" kit-verify \
            sh -c 'cp -a /src /tmp/work && cd /tmp/work \
              && python3 -I scripts/coverage-check.py --selftest \
              && python3 -I scripts/coverage-check.py'

      - name: CodeQL scan in the verification image
        if: steps.changed.outputs.build == 'true'
        run: |
          set +e
          docker run --rm --network=none -v "$PWD:/src:ro" kit-verify \
            sh -c 'cp -a /src /tmp/work && cd /tmp/work && codeql-scan' > scan.txt 2>&1
          code=$?
          set -e
          grep '^codeql: ' scan.txt || true
          [ "$code" -le 1 ] || { tail -20 scan.txt; echo "codeql-scan exit $code"; exit 1; }
          grep -q '^codeql: python: ' scan.txt && grep -q '^codeql: actions: ' scan.txt
