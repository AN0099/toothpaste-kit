name: ci

# The test matrix: the same selftest that gates.yml runs, on more than one
# operating system.
#
# Cross-platform portability is the claim being tested here. gates.yml runs
# on ubuntu-latest alone, so a clean result there says the scripts work with
# GNU userland and says nothing about macOS, where sed, date, grep, ln and
# the bundled bash differ. The scripts are written to be portable, and this
# job is what shows whether they are.
#
# Like gates and commit-attribution, this binds only when set as a required
# status check in the ruleset on the default branch. Unset, it reports and
# blocks nothing. A macOS failure here is a finding about the scripts, to be
# raised, and not a reason to loosen the gate.
#
# Run the same thing yourself:  ./scripts/gates.sh --selftest   or   tests/run

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 15
    strategy:
      # Let both systems finish. A failure on one is information about the
      # other only if the other has run to the end.
      fail-fast: false
      matrix:
        # ubuntu-latest matches gates.yml, so the two systems are compared in one job.
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      # Pinned by commit SHA, as in gates.yml. See
      # docs/security-posture.md, row 3.7.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The gate script is the test suite, and it plants a positive for each
      # gate before the clean result is trusted.
      - name: Gates selftest
        run: ./scripts/gates.sh --selftest

      # No tests/run step: it is exec ./scripts/gates.sh --selftest, so it only repeats the step above.
