name: pr-body

# Checks a pull request's body against .github/pull_request_template.md: every
# heading in order, no template comment left, and a filled Provenance section
# when an agent drafted the change. Advisory: no ruleset requires it. Runs again
# when the body is edited, which the gates workflow does not.

on:
  pull_request:
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  check:
    name: pr-body
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The body is read from the event file, never pasted into the command,
      # so text in a pull request body cannot inject shell. Dependabot writes
      # its body from release notes, not from the template, so its own
      # branches are exempt for the Dependabot account alone, as in the
      # gates workflow's branch-name job.
      - name: Check the pull request body
        env:
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          case "$ACTOR:$HEAD_REF" in
            'dependabot[bot]:dependabot/'*) echo "Dependabot pull request, exempt"; exit 0 ;;
          esac
          python3 scripts/check-pr-body --event
