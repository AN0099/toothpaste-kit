name: gates

# The mechanical checks CONTRIBUTING.md states as rules.
#
# Like commit-attribution, this binds only when set as a required status
# check in the ruleset on the default branch. Unset, it reports and blocks
# nothing.
#
# The gates live in scripts/gates.sh rather than inline here, so that a
# contributor's local run and this job are the same text. A gate whose CI
# copy and local copy are separate can diverge, and the divergence only
# shows up as a clean local run rejected by CI.
#
# Run the same thing yourself:  ./scripts/gates.sh --selftest

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gates:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      # Pinned by commit SHA, read from the upstream v7.0.1 tag
      # (docs/security-posture.md row 3.7); Dependabot moves the SHA and
      # the version comment together.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # --selftest proves each gate can fail against a planted positive
      # before the clean result is trusted. A gate that has never returned a
      # hit has not been shown capable of returning one.
      - name: Mechanical gates
        run: ./scripts/gates.sh --selftest

  # The branch name rule, applied to this pull request's own branch. Gate 13
  # selftests the rule; this checks the name being merged, which a local run
  # cannot see. By now the name is already public, so this is the backstop:
  # the pre-push hook and the ruleset in .github/rulesets/ stop a name before
  # it is published, and this keeps such a branch from merging. Tags are
  # checked by the hook, the tag rulesets and .github/workflows/tags.yml,
  # since this workflow does not run on a tag push.
  branch-name:
    if: github.event_name == 'pull_request'
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The name reaches the script through env, never pasted into the
      # command, so a crafted branch name cannot inject shell. Dependabot
      # names its branches from dependency files, not from requests, so its
      # own prefix is exempt for the Dependabot account alone; the ruleset
      # bypass is for the Dependabot app only (app id 29110).
      - name: Check this pull request's branch name
        env:
          HEAD_REF: ${{ github.head_ref }}
          ACTOR: ${{ github.actor }}
        run: |
          case "$ACTOR:$HEAD_REF" in
            'dependabot[bot]:dependabot/'*) echo "Dependabot branch, exempt"; exit 0 ;;
          esac
          ./scripts/check-branch-name "$HEAD_REF"
