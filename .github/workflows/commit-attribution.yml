name: commit-attribution

# Rejects AI attribution trailers in commit messages, by running
# .githooks/commit-msg on each commit's message.
#
# This is the binding check. The commit-msg hook in .githooks/ is opt-in per
# clone and bypassable with --no-verify; this runs regardless. Make it a
# required status check in the ruleset on the default branch, or it gates
# nothing.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u

          # On a first push to a new branch, github.event.before is all zeroes.
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${HEAD_SHA}"
            echo "No usable base ref, scanning all reachable commits from ${HEAD_SHA}."
          else
            RANGE="${BASE}..${HEAD_SHA}"
            echo "Scanning ${RANGE}"
          fi

          # The pattern lives in one place, .githooks/commit-msg, so this job and
          # a contributor's local hook cannot drift apart.
          MSG="${RUNNER_TEMP}/commit-msg"
          FAILED=0

          for sha in $(git rev-list "${RANGE}"); do
            git log -1 --format='%B' "${sha}" > "${MSG}"
            if ! sh .githooks/commit-msg "${MSG}"; then
              echo "::error::${sha} carries an AI attribution trailer"
              git log -1 --format='%h %s' "${sha}"
              FAILED=1
            fi
          done

          if [ "${FAILED}" -eq 1 ]; then
            echo
            echo "This repository does not carry tool attribution in commit messages."
            echo "Rewrite the offending messages and force-push the branch."
            exit 1
          fi

          echo "Clean."
