name: commit-attribution

# Rejects AI attribution trailers in commit messages.
#
# This is the binding check. The commit-msg hook in .githooks/ is opt-in per
# clone and bypassable with --no-verify; this runs regardless. Make it a
# required status check in the ruleset on the default branch, or it gates
# nothing.

on:
  pull_request:
  push:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scan commit messages
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          set -u

          # On a first push to a new branch, github.event.before is all zeroes.
          if [ -z "${BASE}" ] || [ "${BASE}" = "0000000000000000000000000000000000000000" ]; then
            RANGE="${HEAD_SHA}"
            echo "No usable base ref, scanning all reachable commits from ${HEAD_SHA}."
          else
            RANGE="${BASE}..${HEAD_SHA}"
            echo "Scanning ${RANGE}"
          fi

          PATTERN='Co-Authored-By:.*(Claude|Anthropic)|Claude-Session:|Generated with .*Claude'
          FAILED=0

          for sha in $(git rev-list "${RANGE}"); do
            if git log -1 --format='%B' "${sha}" | grep -qiE "${PATTERN}"; then
              echo "::error::${sha} carries an AI attribution trailer"
              git log -1 --format='%h %s' "${sha}"
              git log -1 --format='%B' "${sha}" | grep -niE "${PATTERN}" || true
              FAILED=1
            fi
          done

          if [ "${FAILED}" -eq 1 ]; then
            echo
            echo "This repository does not carry tool attribution in commit messages."
            echo "Rewrite the offending messages and force-push the branch."
            exit 1
          fi

          echo "Clean."
