name: dco

# Requires a Developer Certificate of Origin sign-off on every commit in a
# pull request: a Signed-off-by line carrying the commit author's email.
# CONTRIBUTING.md says how to add one.
#
# Pull requests only. History before the requirement carries no sign-off, so a
# push to main is not scanned. Merge commits are skipped, since the forge makes
# them. Bot accounts are exempt: a bot cannot certify the DCO, and its pull
# requests are reviewed as the maintainer's work. Like commit-attribution, this
# binds only when set as a required status check in the ruleset on main.

on:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    name: dco
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check sign-off
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -u

          echo "Checking ${BASE}..${HEAD_SHA}"
          FAILED=0

          for sha in $(git rev-list --no-merges "${BASE}..${HEAD_SHA}"); do
            email="$(git log -1 --format='%ae' "${sha}")"
            case "${email}" in
              *'[bot]@users.noreply.github.com')
                echo "${sha} is by a bot account, exempt"
                continue
                ;;
            esac
            if ! git log -1 --format='%(trailers:key=Signed-off-by,valueonly)' "${sha}" | grep -qiF "<${email}>"; then
              echo "::error::${sha} has no Signed-off-by line for its author, ${email}"
              git log -1 --format='%h %s' "${sha}"
              FAILED=1
            fi
          done

          if [ "${FAILED}" -eq 1 ]; then
            echo
            echo "Every commit needs a sign-off: git commit -s"
            echo "To add one, see the licence and sign-off section of CONTRIBUTING.md."
            exit 1
          fi

          echo "Every commit is signed off."
