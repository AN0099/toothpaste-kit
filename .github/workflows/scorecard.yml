name: scorecard

# OpenSSF Scorecard: measures this repository's supply-chain practices
# (branch protection, pinned dependencies, signed releases and others) and
# publishes the result, which is what the README's Scorecard badge reads.
# Results go to the repository's code scanning alerts as well.
#
# Publishing puts rules on this file, and the Scorecard API rejects results
# from a workflow that breaks them: no workflow-level env, defaults or write
# permissions; in the job, no env, defaults, containers or services, an
# Ubuntu hosted runner, and only actions on Scorecard's approved list. Keep
# it that way. The triggers are the two Scorecard documents as supported,
# push and schedule, on the default branch only.

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 6 * * 1"

permissions: read-all

jobs:
  analysis:
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      # Upload the results to code scanning.
      security-events: write
      # Publish the results, which the badge reads.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          sarif_file: results.sarif
