# OpenSSF Security Insights, schema v2.2.0. Every value below is taken from a
# file in this tree or is a link to a file in it. The header dates and schema
# version describe this file, and bug-bounty-available is the maintainer's
# statement that no bounty is offered. An optional field with nothing behind
# it is left out rather than guessed.

header:
  schema-version: 2.2.0
  last-updated: '2026-10-30'
  last-reviewed: '2026-10-30'
  url: https://github.com/AN0099/toothpaste-kit/raw/main/security-insights.yml

project:
  name: toothpaste-kit
  homepage: https://github.com/AN0099/toothpaste-kit
  administrators:
    - name: Aidan Naveja
      primary: true
  repositories:
    - name: toothpaste-kit
      url: https://github.com/AN0099/toothpaste-kit
      comment: |
        A skill library and agent relay protocol for working with large
        language model agents.
  vulnerability-reporting:
    reports-accepted: true
    bug-bounty-available: false
    contact:
      name: Aidan Naveja
      email: an0099+security@proton.me
      primary: true
    policy: https://github.com/AN0099/toothpaste-kit/blob/main/SECURITY.md
    comment: |
      Report through GitHub private vulnerability reporting on this
      repository; the email address is the fallback. An initial response
      within seven days.
    in-scope:
      - A gate that fails open
      - A skill or hook that leaks
      - A script defect with a destructive path
      - A protocol defect that defeats auditability
    out-of-scope:
      - The behavior of any model vendor's product
      - The models themselves
      - Anything about a deployment that this repository does not describe
  documentation:
    detailed-guide: https://github.com/AN0099/toothpaste-kit/blob/main/docs/installing.md
    code-of-conduct: https://github.com/AN0099/toothpaste-kit/blob/main/CODE_OF_CONDUCT.md
    quickstart-guide: https://github.com/AN0099/toothpaste-kit/blob/main/docs/quickstart.md
    release-process: https://github.com/AN0099/toothpaste-kit/blob/main/docs/releasing.md
    support-policy: https://github.com/AN0099/toothpaste-kit/blob/main/SECURITY.md#supported-versions

repository:
  url: https://github.com/AN0099/toothpaste-kit
  status: WIP
  accepts-change-request: true
  accepts-automated-change-request: true
  core-team:
    - name: Aidan Naveja
      primary: true
  license:
    url: https://github.com/AN0099/toothpaste-kit/blob/main/LICENSE
    expression: Apache-2.0
  security:
    assessments:
      self:
        name: Security posture
        evidence: https://github.com/AN0099/toothpaste-kit/blob/main/docs/security-posture.md
        comment: |
          Every control, its state, and the evidence for each, with how
          to re-check it. The OpenSSF Best Practices answers are
          also self assessed.
  documentation:
    contributing-guide: https://github.com/AN0099/toothpaste-kit/blob/main/CONTRIBUTING.md
    dependency-management-policy: https://github.com/AN0099/toothpaste-kit/blob/main/docs/security-posture.md#7-where-a-dependency-is-allowed-to-come-from
    governance: https://github.com/AN0099/toothpaste-kit/blob/main/GOVERNANCE.md
    review-policy: https://github.com/AN0099/toothpaste-kit/blob/main/docs/risk-tiers.md
    security-policy: https://github.com/AN0099/toothpaste-kit/blob/main/SECURITY.md
  release:
    automated-pipeline: false
    distribution-points:
      - uri: https://github.com/AN0099/toothpaste-kit/releases
        comment: GitHub releases, one per annotated and signed tag.
      - uri: https://doi.org/10.5281/zenodo.22850481
        comment: Zenodo concept DOI, minted from each GitHub release; resolves to the newest version.
    changelog: https://github.com/AN0099/toothpaste-kit/blob/main/CHANGELOG.md
